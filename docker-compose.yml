services:
  postgres:
    image: postgres:16-alpine
    container_name: lexicon-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexicon-redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: lexicon-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3021
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      NODE_ENV: production
    ports:
      - "${API_PORT}:3021"

  prisma-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: lexicon-prisma-studio
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
    ports:
      - "5556:5556"
    entrypoint: ["npx", "prisma", "studio", "--port", "5556", "--hostname", "0.0.0.0"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lexicon-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:3000"

volumes:
  pgdata:
  redisdata:

