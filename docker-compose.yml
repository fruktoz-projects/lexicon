version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lexicon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: lexicon_password
      POSTGRES_DB: lexicon_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexicon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lexicon-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://lexicon:lexicon_password@postgres:5432/lexicon_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "expedition_super_secret_jwt_key_2026"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NODE_ENV: development
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lexicon-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:3000/api/v1"

volumes:
  pgdata:
  redisdata:
