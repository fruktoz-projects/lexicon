name: Deploy Lexicon

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Lexicon Services
        run: |
          # 1. Kikapcsoljuk a tulajdonos-ellenőrzést minden mappára a konténeren belül
          git config --global --add safe.directory "*"

          # 2. Belépünk a projekt mappájába (ellenőrizzük, létezik-e)
          cd /home/fruktoz/projects/lexicon || { echo "A mappa nem található!"; exit 1; }

          # 3. Kód frissítése az új organization URL-ről
          git remote set-url origin https://github.com/fruktoz-projects/lexicon.git
          git fetch origin main
          git reset --hard origin/main

          # 4. Változások ellenőrzése
          CHANGED_FILES=$(git diff --name-only HEAD@{1} HEAD || true)
          echo "Megváltozott fájlok:"
          echo "$CHANGED_FILES"

          # 5. Konténerek frissítése
          if echo "$CHANGED_FILES" | grep -E -q 'Dockerfile|docker-compose|package\.json|pnpm-lock\.yaml|apps/web/|apps/api/|packages/'; then
            echo "--> Infra / App változott: Rebuild..."
            docker compose up -d --build api web
          else
            echo "--> Csak kisebb változás: API restart..."
            docker compose restart api
          fi