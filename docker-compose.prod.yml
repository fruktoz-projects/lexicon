version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lexicon-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexicon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexicon_prod_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lexicon_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexicon} -d ${POSTGRES_DB:-lexicon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexicon-prod-redis
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: lexicon-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lexicon}:${POSTGRES_PASSWORD:-lexicon_prod_password_2026}@postgres:5432/${POSTGRES_DB:-lexicon_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-expedition_super_secret_jwt_key_2026_prod}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: lexicon-prod-caddy
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata_prod:
  redisdata_prod:
  caddy_data:
  caddy_config:
